aid: noscrubs
name: NoScrubs
description: 'NoScrubs (NoScrubs, Inc., dba NoScrubs Laundry Delivery) is an on-demand wash-and-fold
  laundry pickup and delivery service operating across US metros including the Bay Area, Los Angeles,
  Dallas-Fort Worth, Miami, Phoenix, Austin, and Houston. Customers schedule a pickup through the NoScrubs
  mobile app or website; trained laundry professionals ("Scrubbers") collect laundry from the doorstep
  within a two-hour window, professionally wash, dry, and fold it using hypoallergenic unscented detergents,
  and return it the same day in as little as four hours. NoScrubs also offers monthly subscription plans,
  gift cards, and a wash-and-fold service for businesses. It is a consumer service company with no public
  developer API; the site publishes an llms.txt for AI agents.'
